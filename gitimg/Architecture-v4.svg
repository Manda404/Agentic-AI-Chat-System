<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG Platform whiteboard overview</title>
  <desc id="desc">Hand drawn style architecture diagram for the current Agentic RAG Platform project.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f35a8"/>
    </marker>
    <marker id="arrowBlack" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#111"/>
    </marker>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <style>
      .bg{fill:#fffefa}
      .title{font:700 48px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#0b0b0b}
      .subtitle{font:700 24px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#6a6c7a}
      .h{font:700 18px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#111}
      .label{font:700 15px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#111}
      .small{font:700 13px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#111}
      .tiny{font:700 11px "Comic Sans MS","Comic Neue","Chalkboard SE",cursive;fill:#111}
      .blue{stroke:#1200a8}
      .green{stroke:#0b821f}
      .orange{stroke:#d96b00}
      .red{stroke:#d41212}
      .purple{stroke:#6616b8}
      .black{stroke:#111}
      .panel{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .card{fill:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .softBlue{fill:#f3f8ff}
      .softGreen{fill:#f4fff5}
      .softOrange{fill:#fff8ed}
      .softRed{fill:#fff5f5}
      .softPurple{fill:#fbf6ff}
      .arrowB{stroke:#0f35a8;stroke-width:3;fill:none;marker-end:url(#arrowBlue);stroke-linecap:round;stroke-linejoin:round}
      .arrowK{stroke:#111;stroke-width:2.7;fill:none;marker-end:url(#arrowBlack);stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#0b821f;stroke-width:2;fill:none;stroke-dasharray:7 7;stroke-linecap:round;stroke-linejoin:round}
      .dot{fill:#fff;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect x="0" y="0" width="1600" height="1000" fill="#fffefa" filter="url(#paper)"/>

  <text class="title" x="28" y="48">Agentic RAG Platform</text>
